name: market_checker
description: "A production-grade BitcoinChecker successor and global multi-market tracker with high-priority audio alarms and persistent foreground ticker for Android & iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  fl_chart: ^0.66.0

  # State Management & Architecture
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking & WebSockets
  http: ^1.2.0
  web_socket_channel: ^2.4.1

  # Local Persistence & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Native Notifications & Background Services
  flutter_local_notifications: ^17.0.0
  flutter_foreground_task: ^6.1.0
  workmanager: ^0.5.2

  # Sound, TTS & Haptics
  audioplayers: ^5.2.1
  flutter_tts: ^3.8.5
  vibration: ^1.8.4

  # Utilities & Sharing
  share_plus: ^7.2.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#090d16"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
