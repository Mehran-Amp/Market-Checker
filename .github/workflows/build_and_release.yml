name: Build & Release (Google Play .aab & App Store .ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flutter_app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload .aab Artifact for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: market-checker-google-play-bundle
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS App (.ipa / Xcode Archive)
    runs-on: macos-13
    defaults:
      run:
        working-directory: ./flutter_app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS No Codesign
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Runner Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-checker-ios-build
          path: flutter_app/build/ios/iphoneos/
